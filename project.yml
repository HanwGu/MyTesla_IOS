name: MyTesla
options:
  bundleIdPrefix: com.yourcompany
  deploymentTarget:
    iOS: 17.0
targets:
  MyTesla:
    type: application
    platform: iOS
    sources:
      - MyTesla
    info:
      path: MyTesla/Info.plist
      properties:
        CFBundleDisplayName: MyTesla
        CFBundleIdentifier: com.yourcompany.mytesla
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        PROVISIONING_PROFILE_SPECIFIER: $(PROVISIONING_PROFILE)
